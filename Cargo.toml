[package]
name = "hw-monitor"
version = "0.1.0"
edition = "2021"
description = "Standalone Windows 10/11 local hardware, Device Manager, and Task Manager monitor"

[dependencies]
tiny_http = "0.12"
sysinfo = "0.33"
wmi = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
